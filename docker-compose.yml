name: peersend-io

services:
  go_server:
    hostname: signal-server
    restart: unless-stopped
    image: peersend.io/signal
    build:
      context: ./
      dockerfile: Dockerfile
      target: development
    ports:
      - 3001:8080
    volumes:
      - ./:/usr/src/app
    networks:
      - peersend-network
    tty: true

  web:
    hostname: peersend-web
    restart: unless-stopped
    image: peersend.io/client
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    ports:
      - 3000:5173
    environment:
      - VITE_SESSION_CODE_EXAMPLE=X-4FGS6
      - VITE_SERVER_ENDPOINT=ws://localhost:3001/signal
    volumes:
      - ./web:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    tty: true

networks:
  peersend-network:
    driver: bridge
    name: peersend.io-network

volumes:
  node_modules:
    name: peersend.io-node_modules
