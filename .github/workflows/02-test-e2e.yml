name: 02 - Test (E2E)
run-name: "Tests: E2E - ${{ github.ref_name }}"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps
        working-directory: ./web

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./web

      - name: Run E2E tests (Chromium)
        run: npm run test:e2e:chromium
        working-directory: ./web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

      - name: Run E2E tests (Firefox)
        run: npm run test:e2e:firefox
        working-directory: ./web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: web/tests/test-results/
          retention-days: 7
