name: 03 - Build
run-name: "Build Docker Image (${{ inputs.tag }})"

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag to push (e.g. dev, 1.2.3)
        required: true
        type: string
      push_latest:
        description: Also tag and push as :latest
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: Git ref to checkout. Defaults to the triggering SHA.
        required: false
        type: string
        default: ""
      target:
        description: Dockerfile build target stage (e.g. deployment-dev, production)
        required: false
        type: string
        default: production

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Construct image tags
        id: meta
        run: |
          TAGS="${SERVER_IMAGE}:${TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${TAGS}
          ${SERVER_IMAGE}:latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          SERVER_IMAGE: ${{ vars.SERVER_IMAGE }}
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Build summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ vars.SERVER_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Package URL:** https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/pkgs/container/$(basename ${{ vars.SERVER_IMAGE }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "**Also tagged as:** \`latest\`" >> $GITHUB_STEP_SUMMARY
          fi
