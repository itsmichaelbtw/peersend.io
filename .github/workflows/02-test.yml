name: 02 - Test
run-name: "Unit and E2E Testing - ${{ github.ref_name }}"

on:
  workflow_call:
    inputs:
      web:
        description: Run lint, type check and unit tests for the web
        type: boolean
        default: true
      server:
        description: Run Go tests for the server
        type: boolean
        default: true
      e2e:
        description: Run E2E tests against Chromium and Firefox
        type: boolean
        default: true

jobs:
  lint:
    name: Lint (Web)
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps
        working-directory: ./web

      - name: Lint
        run: npm run lint
        working-directory: ./web

  test-web:
    name: Unit Tests (Web)
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps
        working-directory: ./web
      - name: Unit tests
        run: npm run test:unit
        working-directory: ./web

  test-server:
    name: Go Tests
    if: ${{ inputs.server }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - name: Run tests
        run: go test ./...
        working-directory: ./server

  test-e2e:
    name: E2E Tests
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps
        working-directory: ./web

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./web

      - name: Pre-download Go modules
        run: go mod download
        working-directory: ./server

      - name: Run E2E tests (Chromium)
        run: npm run test:e2e:chromium
        working-directory: ./web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

      - name: Run E2E tests (Firefox)
        run: npm run test:e2e:firefox
        working-directory: ./web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: web/tests/test-results/
          retention-days: 7
