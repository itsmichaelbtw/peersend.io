name: 06 - CI
run-name: "Continuous Integrations ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/02-test.yml
    secrets: inherit

  # Server image is only built and pushed when all tests pass.
  build-server:
    name: Build Server (dev)
    needs: test
    uses: ./.github/workflows/03-build.yml
    with:
      tag: dev
    secrets: inherit

  # Dev deployment only happens when all tests pass and the image is built.
  deploy-development:
    name: Deploy (development)
    needs: [test, build-server]
    uses: ./.github/workflows/04-deploy.yml
    with:
      environment: development
      server_tag: dev
      cf_pages_branch: development
    secrets: inherit
