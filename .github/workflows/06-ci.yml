name: 06 - CI / CD
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_production && 'Manual deploy to Production' || 'Manual deploy to Development') || format('Automatic deployment by @{0}', github.actor) }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after dev
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Release summary
        if: steps.release.outputs.releases_created == 'true'
        run: |
          echo "### 🎉 Release ${{ steps.release.outputs.version }} created" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY

  # Runs after release. Skipped if release was created or this is a workflow_dispatch.
  test-fast:
    name: Test Fast
    needs: [release]
    if: needs.release.outputs.releases_created != 'true' && github.event_name == 'push'
    uses: ./.github/workflows/02-test-fast.yml
    secrets: inherit

  build-dev:
    name: Build Server (development)
    needs: [release, test-fast]
    if: needs.release.outputs.releases_created != 'true' && needs.test-fast.result == 'success'
    uses: ./.github/workflows/03-build.yml
    with:
      tag: dev
      target: development
    secrets: inherit

  deploy-dev:
    name: Deployment (development)
    needs: [build-dev]
    if: needs.build-dev.result == 'success'
    uses: ./.github/workflows/04-deploy.yml
    with:
      environment: Development
      server_tag: dev
      cf_pages_branch: development
    secrets: inherit

  # Runs if release was created, or manual workflow_dispatch with deploy_production.
  build-prod:
    name: Build Server (production)
    needs: [release]
    if: |
      always() &&
      (
        needs.release.outputs.releases_created == 'true' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_production == true
        )
      )
    uses: ./.github/workflows/03-build.yml
    with:
      tag: ${{ needs.release.outputs.version || 'latest' }}
      push_latest: ${{ needs.release.outputs.releases_created == 'true' }}
      checkout_ref: ${{ needs.release.outputs.tag_name || '' }}
    secrets: inherit

  deploy-prod:
    name: Deploy (production)
    needs: [release, build-prod]
    if: needs.build-prod.result == 'success'
    uses: ./.github/workflows/04-deploy.yml
    with:
      environment: Production
      server_tag: ${{ needs.release.outputs.version || 'latest' }}
      checkout_ref: ${{ needs.release.outputs.tag_name || '' }}
    secrets: inherit
