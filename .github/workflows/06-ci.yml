name: 06 - CI / CD
run-name: "CI/CD – ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Push' }} on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after dev
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Fast checks on every push — lint, unit tests, Go tests. Gates dev deployment.
  test-fast:
    name: Tests (lint, unit, go)
    if: github.event_name == 'push'
    uses: ./.github/workflows/02-test.yml
    with:
      web: true
      server: true
      e2e: false
    secrets: inherit

  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Release summary
        if: steps.release.outputs.releases_created == 'true'
        run: |
          echo "### 🎉 Release ${{ steps.release.outputs.version }} created" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY

  build-dev:
    name: Build Server (dev)
    needs: [test-fast]
    if: |
      always() &&
      (needs.test-fast.result == 'success' || needs.test-fast.result == 'skipped')
    uses: ./.github/workflows/03-build.yml
    with:
      tag: dev
    secrets: inherit

  deploy-dev:
    name: Deploy (development)
    needs: [build-dev]
    if: needs.build-dev.result == 'success'
    uses: ./.github/workflows/04-deploy.yml
    with:
      environment: development
      server_tag: dev
      cf_pages_branch: development
    secrets: inherit

  # E2E always runs after dev deployment so failures are caught before a release is ever created.
  test-e2e:
    name: Tests (E2E)
    needs: [deploy-dev]
    if: needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/02-test.yml
    with:
      web: false
      server: false
      e2e: true
    secrets: inherit

  # Production build and deploy only run if E2E passed against live dev environment.
  build-prod:
    name: Build Server (production)
    needs: [release, deploy-dev, test-e2e]
    if: |
      needs.test-e2e.result == 'success' &&
      (
        needs.release.outputs.releases_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
      )
    uses: ./.github/workflows/03-build.yml
    with:
      tag: ${{ needs.release.outputs.version || 'latest' }}
      push_latest: ${{ needs.release.outputs.releases_created == 'true' }}
      checkout_ref: ${{ needs.release.outputs.tag_name || '' }}
    secrets: inherit

  deploy-prod:
    name: Deploy (production)
    needs: [release, build-prod, deploy-dev]
    if: needs.build-prod.result == 'success'
    uses: ./.github/workflows/04-deploy.yml
    with:
      environment: production
      server_tag: ${{ needs.release.outputs.version || 'latest' }}
      checkout_ref: ${{ needs.release.outputs.tag_name || '' }}
    secrets: inherit
