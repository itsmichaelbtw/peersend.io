name: Lint & Type Check (Web)

on:
  push:
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  get-changes:
    name: Get Changed Files
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.set-files.outputs.files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed TS/TSX files
        id: set-files
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.(ts|tsx)$' || true)

          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          if [ -n "$CHANGED_FILES" ]; then
            echo "### Changed TypeScript files" >> $GITHUB_STEP_SUMMARY
            echo "$CHANGED_FILES" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          else
            echo "No TypeScript files changed." >> $GITHUB_STEP_SUMMARY
          fi

  lint-and-type-check:
    name: Lint & TypeScript Type Check
    runs-on: ubuntu-latest
    needs: get-changes
    if: ${{ needs.get-changes.outputs.changed-files != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.18.2

      - name: Install dependencies
        run: npm install --legacy-deps
        working-directory: ./web

      - name: Run ESLint and Type Check
        id: lint-and-type
        working-directory: ./web
        run: |
          set +e
          npm run lint
          ESLINT_EXIT=$?
          if [ $ESLINT_EXIT -eq 0 ]; then
            echo "- ✅ ESLint succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ ESLint failed" >> $GITHUB_STEP_SUMMARY
          fi

          npm run type-check
          TSC_EXIT=$?
          if [ $TSC_EXIT -eq 0 ]; then
            echo "- ✅ Type check succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Type check failed" >> $GITHUB_STEP_SUMMARY
          fi

          set -e

          if [ $ESLINT_EXIT -ne 0 ] || [ $TSC_EXIT -ne 0 ]; then
            exit 1
          fi
