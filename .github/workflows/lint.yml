name: Lint & Type Check

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  get-changes:
    name: Get Changed Files
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.set-files.outputs.files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get changed TS/TSX files
        id: set-files
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.(ts|tsx)$' || true)
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "### Changed TypeScript files" >> $GITHUB_SUMMARY
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | sed 's/^/- /' >> $GITHUB_SUMMARY
          else
            echo "No TypeScript files changed." >> $GITHUB_SUMMARY
          fi

  lint:
    name: ESLint Changed Files
    runs-on: ubuntu-latest
    needs: get-changes
    if: ${{ needs.get-changes.outputs.changed-files != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.18.2

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          echo "### ESLint Status" >> $GITHUB_SUMMARY
          set +e
          npm run lint -- ${{ needs.get-changes.outputs.changed-files }}
          ESLINT_EXIT=$?
          set -e
          if [ $ESLINT_EXIT -eq 0 ]; then
            echo "- ✅ ESLint succeeded" >> $GITHUB_SUMMARY
          else
            echo "- ❌ ESLint failed" >> $GITHUB_SUMMARY
            exit $ESLINT_EXIT
          fi

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: get-changes
    if: ${{ needs.get-changes.outputs.changed-files != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.18.2

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        id: tsc
        run: |
          echo "### Type Check Status" >> $GITHUB_SUMMARY
          set +e
          npm run type-check
          TSC_EXIT=$?
          set -e
          if [ $TSC_EXIT -eq 0 ]; then
            echo "- ✅ TypeScript type check succeeded" >> $GITHUB_SUMMARY
          else
            echo "- ❌ TypeScript type check failed" >> $GITHUB_SUMMARY
            exit $TSC_EXIT
          fi
