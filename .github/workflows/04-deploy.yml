name: 04 - Deploy
run-name: "Deploy ${{ github.ref_name }} (${{ inputs.environment }})"

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to (development | production)
        required: true
        type: string
      server_tag:
        description: Docker image tag for the server image
        required: true
        type: string
      checkout_ref:
        description: Git ref to checkout. Defaults to the triggering SHA.
        required: false
        type: string
        default: ""
      cf_pages_branch:
        description: Cloudflare Pages branch for preview deployments. Leave empty for production deployment.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  deploy-web:
    name: Deploy Web (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps
        working-directory: ./web

      - name: Write Vite env file
        run: echo "${{ secrets.VITE_ENV }}" > web/.env

      - name: Build
        run: npm run build
        working-directory: ./web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >-
            pages deploy web/dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            ${{ inputs.cf_pages_branch != '' && format('--branch={0}', inputs.cf_pages_branch) || '' }}

  deploy-server:
    name: Deploy Server (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY_PATH: /tmp/deploy_key
      SERVER_DIRECTORY: ${{ vars.HOME_DIRECTORY }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Write server env file
        run: |
          mkdir -p deploy/${{ inputs.environment }}
          echo "${{ secrets.GOLANG_ENV }}" > deploy/${{ inputs.environment }}/server.env

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "${SSH_KEY_PATH}"
          chmod 600 "${SSH_KEY_PATH}"

      - name: Copy deploy folder to server
        run: |
          rsync -az --delete \
            -e "ssh -i '${SSH_KEY_PATH}' -p '${SSH_PORT}' -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=6" \
            deploy/ \
            "${SSH_USER}@${SSH_HOST}:${SERVER_DIRECTORY}/deploy/"

      - name: Deploy server via SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SERVER_IMAGE: ${{ vars.SERVER_IMAGE }}
          SERVER_TAG: ${{ inputs.server_tag }}
          SERVER_CONTAINER_NAME: ${{ vars.SERVER_CONTAINER_NAME }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          NGINX_CONTAINER_NAME: ${{ vars.NGINX_CONTAINER_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ssh \
            -i "${SSH_KEY_PATH}" \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${SSH_USER}@${SSH_HOST}" \
            "SERVER_DIRECTORY='${SERVER_DIRECTORY}' \
             GHCR_TOKEN='${GHCR_TOKEN}' \
             GITHUB_ACTOR='${GITHUB_ACTOR}' \
             SERVER_IMAGE='${SERVER_IMAGE}' \
             SERVER_TAG='${SERVER_TAG}' \
             SERVER_CONTAINER_NAME='${SERVER_CONTAINER_NAME}' \
             DOCKER_NETWORK='${DOCKER_NETWORK}' \
             NGINX_CONTAINER_NAME='${NGINX_CONTAINER_NAME}' \
             ENVIRONMENT='${ENVIRONMENT}' \
             chmod +x '${SERVER_DIRECTORY}/deploy/deploy.sh' && \
             sh '${SERVER_DIRECTORY}/deploy/deploy.sh'"

      - name: Clean up SSH key
        if: always()
        run: rm -f "${SSH_KEY_PATH}"
