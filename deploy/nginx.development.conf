server {
    listen 80;
    server_name server.development.peersend.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name server.development.peersend.io;

    ssl_certificate     /etc/letsencrypt/live/peersend.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peersend.io/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=3600" always;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass          http://peersend-server-dev:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;

    access_log /var/log/nginx/peersend-dev.access.log;
}
